
          <section class="note-desk" aria-labelledby="notes-title">
            <div class="note-heading">
              <div>
                <p class="note-label">Writer notes</p>
                <h3 id="notes-title">Keep fragments close</h3>
              </div>
              <span id="note-count">0 notes</span>
            </div>

            <div class="note-compose">
              <label>
                <span class="sr-only">New note</span>
                <textarea id="note-input" placeholder="Jot an image, quote, scene beat, reminder..."></textarea>
              </label>
              <button class="button button-ghost" type="button" id="add-note">Add note</button>
            </div>

            <div class="note-list" id="note-list" aria-live="polite"></div>
          </section>
